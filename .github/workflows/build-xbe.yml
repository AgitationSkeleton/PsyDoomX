name: Build XBE

# Every push and pull request gets built so a break is caught where it happened. Pushing a tag that
# looks like a version also cuts a release and attaches the executable to it.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  LLVM_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # nxdk is built from source rather than pulled as an image.
      #
      # The first attempt ran the whole job inside a container guessed at from the project's name, and
      # the checkout failed before anything else ran: 'actions/checkout' needs git inside the container
      # to do a real clone, and a minimal build image has no reason to carry it. Building from source is
      # what nxdk actually documents, it needs nothing that cannot be checked here, and the result is
      # cached so it only costs the first run after nxdk changes.
      - name: Install the toolchain nxdk needs
        run: |
          sudo apt-get -y update
          sudo apt-get -y install pkgconf cmake make git ca-certificates wget lsb-release software-properties-common gnupg

      # A specific clang, rather than whichever one the runner image happens to ship.
      #
      # The runner's is 18.1.3, and sol2 does not compile with it: 'address of overloaded function
      # call does not match required type int (lua_State *)', thrown from 'function_types.hpp' the
      # moment 'ScriptBindings.cpp' pulls sol2 in. Nothing to do with nxdk or with this port - the
      # same tree builds clean locally against clang 21.
      #
      # 21 rather than 19 or 20 on nxdk's own advice: 'bin/activate' warns that versions from 19.x to
      # 20.1.2 carry a bug that breaks code compiled with optimisations on, which is exactly how this
      # is built. See https://github.com/llvm/llvm-project/issues/134607
      #
      # nxdk's wrappers call plain 'clang', 'lld' and 'llvm-lib', so putting LLVM's own bin directory
      # first is enough - there is nothing to symlink and no alternatives to juggle.
      - name: Install clang ${{ env.LLVM_VERSION }}
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }} all
          echo "/usr/lib/llvm-${{ env.LLVM_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Say which compiler this is
        run: |
          # Printed because a build that fails on a compiler version should say which one without
          # anyone having to guess, which is how the last two of these went.
          which clang lld llvm-lib
          clang --version

      - name: Check out
        uses: actions/checkout@v4
        # No submodules: this repository has none. No history depth either - the build id is passed in
        # below, so there is nothing here that needs to look back past the current commit.

      - name: Check out nxdk
        uses: actions/checkout@v4
        with:
          repository: XboxDev/nxdk
          path: nxdk
          submodules: recursive
          fetch-depth: 0

      - name: Which nxdk is this
        id: nxdk
        run: echo "sha=$(git -C nxdk rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Keyed on the nxdk commit, so a new nxdk rebuilds it and nothing else does
      - name: Reuse a previous nxdk build
        id: nxdk-cache
        uses: actions/cache@v4
        with:
          path: nxdk
          key: nxdk-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-${{ steps.nxdk.outputs.sha }}

      - name: Build nxdk
        if: steps.nxdk-cache.outputs.cache-hit != 'true'
        # Built the way nxdk's own CI builds it, in '.ci_build_samples.sh': activate the environment
        # first, then make from inside the tree. The first attempt did neither - it ran 'make -C nxdk'
        # from outside with none of that environment set - and the build failed before producing
        # anything. Worth copying exactly rather than approximating.
        run: |
          cd nxdk
          eval "$(./bin/activate -s)"
          make NXDK_ONLY=y -j "$(nproc)"

      - name: Check nxdk produced its toolchain file
        run: test -f nxdk/share/toolchain-nxdk.cmake

      - name: Work out the build id
        id: buildid
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "id=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: |
          # Optimisation is set explicitly: the nxdk toolchain leaves CMAKE_CXX_FLAGS_RELEASE empty, so
          # asking for a Release build alone does not guarantee a -O flag actually reaches the compiler.
          cmake -S . -B build-xbox -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/nxdk/share/toolchain-nxdk.cmake" \
            -DPSYDOOM_XBOX_BUILD_ID="${{ steps.buildid.outputs.id }}" \
            -DPSYDOOM_INCLUDE_VULKAN_RENDERER=OFF \
            -DPSYDOOM_INCLUDE_LAUNCHER=OFF \
            -DPSYDOOM_INCLUDE_AUDIO_TOOLS=OFF \
            -DPSYDOOM_INCLUDE_OTHER_TOOLS=OFF \
            -DPSYDOOM_INCLUDE_OLD_CODE=OFF
        env:
          NXDK_DIR: ${{ github.workspace }}/nxdk

      - name: Build
        run: cmake --build build-xbox --target PsyDoom -j "$(nproc)"
        env:
          NXDK_DIR: ${{ github.workspace }}/nxdk

      - name: Check the executable was produced
        run: |
          # A build that succeeds without producing an XBE has failed at something the exit code did not
          # report, and an empty release asset is worse than a failed job.
          test -s build-xbox/game/default.xbe
          ls -l build-xbox/game/default.xbe
          md5sum build-xbox/game/default.xbe

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: PsyDoomX-${{ steps.buildid.outputs.id }}
          path: build-xbox/game/default.xbe
          if-no-files-found: error

      - name: Attach it to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build-xbox/game/default.xbe
          generate_release_notes: true
          body: |
            Put `default.xbe` in `E:\Apps\PsyDoomX\` on the console, alongside a folder for each game
            you own - see the README for the layout.

            No game data is included. You need your own disc images.
